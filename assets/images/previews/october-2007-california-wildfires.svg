    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a0a00" />
      <stop offset="50%" stop-color="#3d1200" />
      <stop offset="100%" stop-color="#0d0500" />
