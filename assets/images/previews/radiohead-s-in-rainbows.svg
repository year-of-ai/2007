<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Radiohead's In Rainbows – Retro Pixel Art Banner</title>
  <defs>
    <radialGradient id="crt" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0033" />
